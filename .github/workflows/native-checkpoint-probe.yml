name: Native checkpoint transfer probe (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 native/chromium-148/checkpoint.py probe-save "$GITHUB_WORKSPACE/probe"
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe/checkpoint/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  restore:
    needs: save
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: checkpoint-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe/checkpoint/
      - run: python3 native/chromium-148/checkpoint.py probe-restore "$GITHUB_WORKSPACE/probe"
